name: CI
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
    - uses: actions/checkout@v2

    - name: Set version
      id: version
      shell: bash
      run: |
        source version.env
        echo "$VERSION"
        echo ::set-output name=version::$VERSION

    - name: Install rclone
      run: |
        curl -fsSL -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
        if [ ! -f rclone-current-linux-amd64.zip ]; then
          echo "Failed to download rclone"
          exit 1
        fi
        unzip rclone-current-linux-amd64.zip
        cd rclone-*-linux-amd64
        sudo cp rclone /usr/bin/
        sudo chown root:root /usr/bin/rclone
        sudo chmod 755 /usr/bin/rclone
        rclone --version
        rclone config create spaces s3 \
          provider=DigitalOcean \
          endpoint=$AWS_S3_ENDPOINT \
          access_key_id=$AWS_ACCESS_KEY_ID \
          secret_access_key=$AWS_SECRET_ACCESS_KEY

    - name: Build docker image
      run: |
        docker build --tag pad-normalize .

    - name: Build dataset!
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        docker run --user $(id -u):$(id -g) \
          -v $(pwd)/data:/usr/local/src/scripts/data pad-normalize $VERSION
    
    - name: Upload!
      if: github.ref == 'refs/heads/main'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: ./push-to-bucket.sh 
